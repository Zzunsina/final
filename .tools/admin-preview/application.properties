spring.application.name=JobBridgePreview
spring.datasource.url=jdbc:h2:mem:admin-ui-preview;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=preview-local
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.jwt-secret=${JWT_SECRET}
app.secure-cookie=false
app.seed-password=${DEV_SEED_PASSWORD:}
