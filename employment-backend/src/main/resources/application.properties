spring.application.name=Employment

# MariaDB 연결
spring.datasource.url=jdbc:mariadb://localhost:3306/employment_db
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1111
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# 서버
server.port=8080
server.error.include-message=never

# 인증
app.jwt-secret=${JWT_SECRET}
app.secure-cookie=false
app.seed-password=${DEV_SEED_PASSWORD:}
